name: bump

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: render/go.mod
          cache-dependency-path: render/go.mod
      - name: Bump upstream pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./render bump .claude-plugin/marketplace.json --write
      - uses: peter-evans/create-pull-request@v8.1.3
        with:
          branch: chore/bump-upstream-skills
          commit-message: "chore(deps): bump upstream skill pins"
          title: "chore(deps): bump upstream skill pins"
          body: Moves upstream skill pins in the marketplace catalog to their newest tag or default-branch commit.
          delete-branch: true
